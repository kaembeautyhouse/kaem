<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Seguridad: solo se permite hablar con el servidor de KAÉM, cargar fotos de Shopify y las fuentes -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.shopify.com https://*.shopify.com https://*.shopifycdn.com; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F4EE">
<title>Catálogo KAÉM Beauty House</title>
<!-- Vista previa al compartir por WhatsApp (tarjeta con imagen, título y descripción) -->
<meta name="description" content="Precios exclusivos, stock al día y tu pedido listo en minutos. Arma tu carrito y envíalo por WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KAÉM Beauty House">
<meta property="og:title" content="KAÉM BEAUTY HOUSE · Catálogo Distribuidores y Mayoristas">
<meta property="og:description" content="Precios exclusivos, stock al día y tu pedido listo en minutos. Arma tu carrito y envíalo por WhatsApp.">
<meta property="og:image" content="https://kaembeautyhouse.github.io/kaem/og-catalogo.jpg">
<meta property="og:image:secure_url" content="https://kaembeautyhouse.github.io/kaem/og-catalogo.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta property="og:image:alt" content="KAÉM Beauty House · Catálogo para distribuidores y mayoristas">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" href="logo.png" as="image">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Paleta oficial KAÉM */
  :root{--arena:#E5DDD0;--crema:#F7F4EE;--piedra:#C2B6A6;--espresso:#2C211E;--salvia:#8FA08E;--terracota:#B86B53;
        --blanco:#FFFFFF;--suave:#6B5B52;--salvia-txt:#5E7160;--rojo:#A94B36}
  *{box-sizing:border-box}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  html,body{margin:0;background:var(--crema);color:var(--espresso);font-family:'Jost',system-ui,sans-serif}
  button,input,textarea{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
  header{position:relative;padding:calc(26px + env(safe-area-inset-top)) 0 8px;text-align:center}
  /* Logo oficial (logo.png del repositorio, fondo transparente) */
  .logo{display:block;margin:0 auto;width:min(220px,58vw);height:auto;aspect-ratio:2298/1134}
  .sonido{position:absolute;right:0;top:calc(18px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;border:1px solid var(--piedra);
          background:var(--blanco);color:var(--espresso);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sonido svg{width:18px;height:18px}
  .nivel{display:inline-block;margin:16px 0 8px;padding:7px 16px;border-radius:20px;background:var(--espresso);color:var(--crema);font-size:12.5px;letter-spacing:.08em}
  .reglas{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 0;padding:0;list-style:none}
  .reglas li{font-size:11.5px;padding:5px 11px;border-radius:14px;background:var(--arena);color:var(--espresso)}
  .reglas li.gratis{background:rgba(143,160,142,.22);color:var(--salvia-txt)}
  .buscar{position:sticky;top:0;z-index:5;background:var(--crema);padding:12px 0 6px}
  .buscar input{width:100%;font-size:16px;padding:13px 16px;border-radius:14px;border:1px solid var(--piedra);background:var(--blanco);color:var(--espresso);outline:none;transition:border-color .2s,box-shadow .2s}
  .buscar input:focus{border-color:var(--terracota);box-shadow:0 0 0 3px rgba(184,107,83,.14)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--piedra);background:var(--blanco);font-size:13px;color:var(--espresso);cursor:pointer;white-space:nowrap;transition:all .18s}
  .chip.on{background:var(--espresso);color:var(--crema);border-color:var(--espresso)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .card{background:var(--blanco);border:1px solid var(--arena);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .card.anim{animation:entrar .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
  @keyframes entrar{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .foto{aspect-ratio:1/1;background:var(--arena);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .foto img.lista{opacity:1}
  .ph{font-family:'Playfair Display',serif;font-size:14px;letter-spacing:.18em;color:var(--suave);text-align:center;padding:10px}
  .info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .mk{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
  .nom{font-family:'Playfair Display',serif;font-size:14.5px;line-height:1.25;margin:0}
  .tonos{display:flex;flex-wrap:wrap;gap:5px}
  .tono{font-size:11px;padding:4px 9px;border-radius:14px;border:1px solid var(--piedra);background:var(--crema);cursor:pointer;color:var(--espresso);transition:all .15s}
  .tono.on{border-color:var(--terracota);background:rgba(184,107,83,.1);font-weight:600}
  .tono .n{display:inline-block;min-width:15px;margin-left:4px;padding:0 4px;border-radius:8px;background:var(--terracota);color:#fff;font-size:10px;text-align:center}
  .pie{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .precio{font-family:'Playfair Display',serif;font-size:17px}
  .etq{font-size:10.5px;padding:3px 8px;border-radius:10px;background:rgba(143,160,142,.2);color:var(--salvia-txt);white-space:nowrap}
  .etq.pocas{background:rgba(184,107,83,.14);color:var(--terracota)}
  .agregar{width:100%;padding:10px;border-radius:12px;border:none;background:var(--espresso);color:var(--crema);font-size:14px;cursor:pointer;transition:transform .12s}
  .agregar:active,.paso button:active,.btn:active,.chip:active,.tono:active{transform:scale(.95)}
  .paso{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--espresso);border-radius:12px;overflow:hidden}
  .paso button{width:42px;height:40px;border:none;background:var(--espresso);color:var(--crema);font-size:20px;cursor:pointer;transition:transform .12s}
  .paso b{font-size:15px;display:inline-block}
  .paso b.bump{animation:bump .28s ease}
  @keyframes bump{40%{transform:scale(1.35)}}
  .vacio{text-align:center;color:var(--suave);padding:40px 10px;font-size:14px}
  /* Barra del pedido: mínimo (terracota) y envío gratis (salvia) */
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
         border-top:1px solid var(--arena);padding:12px 16px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .barra.on{transform:none}
  .barra-in{max-width:1100px;margin:0 auto}
  .prog{position:relative;height:8px;border-radius:8px;background:var(--arena);overflow:visible;margin:4px 0 4px}
  .prog .f1,.prog .f2{position:absolute;top:0;bottom:0;border-radius:8px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .prog .f1{left:0;background:var(--terracota)}
  .prog .f2{background:var(--salvia)}
  .prog .hito{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--espresso);transform:translateX(-50%)}
  .prog.celebra{animation:celebra .6s ease}
  @keyframes celebra{30%{transform:scaleY(1.9)}}
  .hitos{position:relative;height:16px;font-size:10.5px;color:var(--suave);margin-bottom:6px}
  .hitos span{position:absolute;top:0;white-space:nowrap;transform:translateX(-50%)}
  .hitos span.fin{right:0;transform:none}
  .hitos span.ok{color:var(--salvia-txt);font-weight:600}
  .barra-fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .barra-txt{font-size:12.5px;color:var(--suave);line-height:1.35}
  .barra-txt b{display:block;font-family:'Playfair Display',serif;font-size:19px;color:var(--espresso)}
  .btn{padding:13px 20px;border-radius:14px;border:none;background:var(--espresso);color:var(--crema);font-size:15px;cursor:pointer;white-space:nowrap;transition:transform .12s,opacity .2s}
  .btn:disabled{opacity:.45}
  .btn.wa{background:#25D366;color:#fff;width:100%;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .hoja{position:fixed;inset:0;z-index:30;background:rgba(44,33,30,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .hoja.on{opacity:1;pointer-events:auto}
  .hoja-in{background:var(--crema);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
           transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .hoja.on .hoja-in{transform:none}
  .hoja h2{font-family:'Playfair Display',serif;font-weight:400;font-size:22px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .cerrar{border:none;background:var(--arena);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--espresso)}
  .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--arena)}
  .it .t{flex:1;min-width:0;font-size:13px;line-height:1.35}
  .it .t small{display:block;color:var(--suave)}
  .it .paso{flex:0 0 118px}
  .it .paso button{width:36px;height:34px;font-size:17px}
  .cuentas{margin:14px 0 4px;font-size:14px}
  .cuentas div{display:flex;justify-content:space-between;padding:3px 0}
  .cuentas .g{color:var(--salvia-txt);font-weight:600}
  .cuentas .tot{border-top:1px solid var(--piedra);margin-top:6px;padding-top:8px}
  .cuentas .tot b{font-family:'Playfair Display',serif;font-size:22px}
  .falta{font-size:12.5px;color:var(--terracota);margin:6px 0 10px}
  .pista{font-size:12px;color:var(--salvia-txt);margin:6px 0 0}
  .campo{margin:10px 0}
  .campo label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 5px}
  .campo input,.campo textarea{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--piedra);background:var(--blanco);color:var(--espresso);outline:none}
  .campo input:focus,.campo textarea:focus{border-color:var(--terracota)}
  .campo input.mal{border-color:var(--rojo);animation:sacude .35s}
  @keyframes sacude{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .trampa{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .aviso{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:50;max-width:92vw;opacity:0;pointer-events:none;
         background:var(--espresso);color:var(--crema);padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.4;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:all .3s}
  .aviso.on{opacity:1;transform:translate(-50%,0)}
  .ok-box{text-align:center;padding:10px 4px}
  .ok-box > svg{width:72px;height:72px}
  .btn.wa svg{width:20px;height:20px;flex:0 0 auto}
  .ok-box > svg circle{stroke:var(--salvia);stroke-width:3;fill:none;stroke-dasharray:190;stroke-dashoffset:190;animation:trazo .6s ease forwards}
  .ok-box > svg path{stroke:var(--salvia);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:trazo .4s .45s ease forwards}
  @keyframes trazo{to{stroke-dashoffset:0}}
  .ok-box h3{font-family:'Playfair Display',serif;font-weight:400;font-size:24px;margin:8px 0 4px}
  .ok-box p{color:var(--suave);font-size:14px;line-height:1.55;margin:6px 0}
  .cargando{text-align:center;padding:60px 10px;color:var(--suave)}
  .esqueleto{background:linear-gradient(90deg,var(--arena) 0%,#EFE9DF 50%,var(--arena) 100%);background-size:200% 100%;animation:brillo 1.2s infinite;border-radius:18px;aspect-ratio:3/4}
  @keyframes brillo{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="sonido" id="sonido" type="button" aria-label="Sonidos"></button>
    <h1 style="margin:0"><img class="logo" src="logo.png" alt="KAÉM Beauty House" width="2298" height="1134" decoding="async" fetchpriority="high"></h1>
    <span class="nivel" id="nivel">Catálogo</span>
    <ul class="reglas" id="reglas"></ul>
  </header>
  <div class="buscar">
    <input id="q" type="search" placeholder="🔎 Busca un producto, marca o tono…" autocomplete="off" enterkeyhint="search">
    <div class="chips" id="chips"></div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="estado" class="cargando">Preparando tu catálogo… ✨</div>
</div>

<div class="barra" id="barra"><div class="barra-in">
  <div class="prog" id="prog"><i class="f1"></i><i class="f2"></i><span class="hito" id="hito"></span></div>
  <div class="hitos" id="hitos"></div>
  <div class="barra-fila">
    <div class="barra-txt" id="barraTxt"></div>
    <button class="btn" id="verPedido" type="button">Ver pedido</button>
  </div>
</div></div>

<div class="hoja" id="hoja"><div class="hoja-in" id="hojaIn"></div></div>
<div class="aviso" id="aviso" role="status"></div>

<script>
(function(){
  'use strict';
  var API_URL = "https://script.google.com/macros/s/AKfycbxmXydJ_8gBqVZZ7rx8mCPZc5u80pyMj30o52I993rxdWotODEhTwwfEo05PNKf4OiiZA/exec";
  var CLAVE = (new URLSearchParams(location.search).get('k') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40);
  var CAT = null, CARRITO = {}, VAR = {}, FILTRO = { q:'', marca:'' }, TONO_SEL = {}, ULTIMO = '', ESTADO_BARRA = -1;
  var $ = function(id){ return document.getElementById(id); };
  var cop = function(n){ return '$' + Math.round(n||0).toLocaleString('es-CO'); };
  var esc = function(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var guardar = function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  var leer = function(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
  var vibrar = function(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} };

  /* ——— Sonidos suaves (como en la app). Se activan con el primer toque; se pueden silenciar. ——— */
  var SON = (function(){
    var ctx = null, on = localStorage.getItem('kaem_cat_sonido') !== '0';
    function notas(lista, vol){
      if(!on) return;
      try{
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if(ctx.state === 'suspended') ctx.resume();
        var t0 = ctx.currentTime;
        lista.forEach(function(n){
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = n[0];
          g.gain.setValueAtTime(0.0001, t0 + n[1]);
          g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + n[1] + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
          o.connect(g); g.connect(ctx.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2] + 0.02);
        });
      }catch(e){}
    }
    return {
      agregar: function(){ notas([[880,0,.07],[1320,.05,.09]]); },
      quitar:  function(){ notas([[560,0,.09]], .05); },
      tono:    function(){ notas([[1180,0,.05]], .04); },
      hito:    function(){ notas([[660,0,.1],[880,.09,.1],[1175,.18,.18]]); },
      enviado: function(){ notas([[523,0,.12],[659,.1,.12],[784,.2,.12],[1047,.3,.3]]); },
      error:   function(){ notas([[240,0,.16]], .06); },
      on: function(){ return on; },
      alternar: function(){ on = !on; try{ localStorage.setItem('kaem_cat_sonido', on?'1':'0'); }catch(e){} if(on) notas([[988,0,.08]]); return on; }
    };
  })();
  function pintarSonido(){
    $('sonido').innerHTML = SON.on()
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
    $('sonido').setAttribute('aria-label', SON.on() ? 'Silenciar sonidos' : 'Activar sonidos');
  }

  function aviso(msg){ var a=$('aviso'); a.textContent=msg; a.classList.add('on'); clearTimeout(a._t); a._t=setTimeout(function(){ a.classList.remove('on'); }, Math.min(8000, 2600+msg.length*45)); }
  function api(action, data){
    var ctrl = window.AbortController ? new AbortController() : null, t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 30000);
    return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, redirect:'follow', cache:'no-store',
      signal: ctrl ? ctrl.signal : undefined, body: JSON.stringify({ action:action, data:data }) })
      .then(function(r){ return r.text(); }).then(function(t2){ clearTimeout(t); return JSON.parse(t2); })
      .catch(function(e){ clearTimeout(t); throw e; });
  }

  /* ——— Carga: primero lo guardado (instantáneo), luego lo fresco del servidor ——— */
  function cargar(){
    if(!CLAVE){ $('estado').textContent='Este enlace está incompleto 🤔 Pídele a KAÉM el enlace de tu catálogo.'; return; }
    var previo = leer('kaem_cat_'+CLAVE);
    if(previo && previo.ok) aplicar(previo);
    else { var sk=''; for(var i=0;i<6;i++) sk+='<div class="esqueleto"></div>'; $('grid').innerHTML=sk; }
    api('catalogoPublico', { clave:CLAVE }).then(function(r){
      if(!r || !r.ok){
        if(!previo){ $('grid').innerHTML=''; $('estado').style.display='block'; $('estado').textContent=(r&&r.message)||'No se pudo cargar el catálogo.'; }
        else aviso((r&&r.message)||'No se pudo actualizar el catálogo.');
        return;
      }
      guardar('kaem_cat_'+CLAVE, r); aplicar(r);
    }).catch(function(){
      if(!previo){ $('grid').innerHTML=''; $('estado').innerHTML='No pudimos conectar 📶 Revisa tu internet y <a href="" style="color:inherit">vuelve a intentar</a>.'; }
    });
  }
  function aplicar(r){
    CAT = r; VAR = {};
    if(!CAT.envio) CAT.envio = { gratisDesde: 0, amGratis:false, tarifa:15000, ciudadesAM:[] };
    r.productos.forEach(function(g){ g.variantes.forEach(function(v){ VAR[v.sku] = { g:g, v:v }; }); });
    var c = leer('kaem_carrito_'+CLAVE) || {}; CARRITO = {};
    Object.keys(c).forEach(function(s){ if(VAR[s] && c[s]>0) CARRITO[s]=c[s]; });
    $('nivel').textContent = '✨ Catálogo ' + r.nivel;
    var e = CAT.envio, reglas = ['💰 Precios de ' + r.nivel.toLowerCase(), '🛒 Pedido mínimo ' + cop(r.minimo)];
    if(r.minPorRef > 1) reglas.push('📦 Mínimo ' + r.minPorRef + ' unidades por referencia');
    var gratis = ['🚚 Envío gratis desde ' + cop(e.gratisDesde)];
    if(e.amGratis) gratis.push('🏙️ Gratis siempre en el área metropolitana de Bucaramanga');
    $('reglas').innerHTML = reglas.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('') + gratis.map(function(t){ return '<li class="gratis">'+esc(t)+'</li>'; }).join('');
    pintarChips(); pintar(true); pintarBarra(true);
  }

  /* ——— Catálogo ——— */
  function pintarChips(){
    var h='<button class="chip'+(FILTRO.marca?'':' on')+'" data-m="">Todas</button>';
    CAT.marcas.forEach(function(m){ h+='<button class="chip'+(FILTRO.marca===m?' on':'')+'" data-m="'+esc(m)+'">'+esc(m)+'</button>'; });
    $('chips').innerHTML=h;
  }
  function pintar(animar){
    var q=FILTRO.q.trim().toLowerCase(), h='', n=0;
    CAT.productos.forEach(function(g){
      if(FILTRO.marca && g.marca!==FILTRO.marca) return;
      if(q && (g.nombre+' '+g.marca+' '+g.variantes.map(function(v){return v.tono;}).join(' ')).toLowerCase().indexOf(q)<0) return;
      var sel = TONO_SEL[g.id] && VAR[TONO_SEL[g.id]] ? TONO_SEL[g.id] : g.variantes[0].sku;
      var v = VAR[sel].v, foto = v.foto || g.foto;
      var tonos = (g.variantes.length>1 || v.tono) ? '<div class="tonos">'+g.variantes.map(function(x){
        var c=CARRITO[x.sku]||0;
        return '<button class="tono'+(x.sku===sel?' on':'')+'" data-g="'+esc(g.id)+'" data-s="'+esc(x.sku)+'">'+esc(x.tono||'Único')+(c?'<span class="n">'+c+'</span>':'')+'</button>';
      }).join('')+'</div>' : '';
      var cant = CARRITO[sel]||0;
      var accion = cant ? '<div class="paso"><button data-menos="'+esc(sel)+'" aria-label="Quitar una">−</button><b'+(sel===ULTIMO?' class="bump"':'')+'>'+cant+'</b><button data-mas="'+esc(sel)+'" aria-label="Agregar una">+</button></div>'
                        : '<button class="agregar" data-mas="'+esc(sel)+'">Agregar'+(CAT.minPorRef>1?' '+CAT.minPorRef:'')+'</button>';
      h+='<div class="card'+(animar?' anim':'')+'" style="--d:'+Math.min(n*35,420)+'ms"><div class="foto" data-marca="'+esc(g.marca)+'">'
        +(foto?'<img src="'+esc(foto)+'" alt="'+esc(g.nombre)+'" loading="lazy" decoding="async">':'<span class="ph">'+esc(g.marca)+'</span>')+'</div>'
        +'<div class="info"><span class="mk">'+esc(g.marca)+'</span><p class="nom">'+esc(g.nombre)+'</p>'+tonos
        +'<div class="pie"><span class="precio">'+cop(v.precio)+'</span><span class="etq'+(v.etiqueta!=='Disponible'?' pocas':'')+'">'+esc(v.etiqueta)+'</span></div>'
        +accion+'</div></div>';
      n++;
    });
    $('grid').innerHTML=h;
    $('estado').style.display = n ? 'none' : 'block';
    if(!n){ $('estado').className='vacio'; $('estado').textContent = CAT.productos.length ? 'No encontramos productos con esa búsqueda 🔎' : 'No hay productos disponibles en este momento.'; }
    ULTIMO='';
  }
  function cambiar(sku, delta){
    var min=CAT.minPorRef, c=CARRITO[sku]||0;
    if(delta>0) c = c ? c+1 : min;                    // el primer toque agrega el mínimo por referencia
    else c = (c-1 < min) ? 0 : c-1;                   // por debajo del mínimo, sale del pedido
    if(c) CARRITO[sku]=c; else delete CARRITO[sku];
    guardar('kaem_carrito_'+CLAVE, CARRITO);
    if(delta>0){ SON.agregar(); vibrar(8); } else { SON.quitar(); vibrar(5); }
    ULTIMO = sku;
    pintar(false); pintarBarra(false); if($('hoja').classList.contains('on') && !$('hoja')._exito) pintarHoja();
  }

  /* ——— Cuentas: subtotal, envío y total (el servidor vuelve a calcular todo al recibir) ——— */
  function esAreaMetro(ciudad){
    var c=String(ciudad||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return ['BUCARAMANGA','FLORIDABLANCA','GIRON','PIEDECUESTA'].some(function(m){ return c.indexOf(m)>=0; });
  }
  function totales(ciudad){
    var st=0,u=0,r=0; Object.keys(CARRITO).forEach(function(s){ if(!VAR[s]) return; st+=VAR[s].v.precio*CARRITO[s]; u+=CARRITO[s]; r++; });
    var e=CAT.envio, am = e.amGratis && esAreaMetro(ciudad);
    var flete = (am || st>=e.gratisDesde) ? 0 : e.tarifa;
    return { subtotal:st, unidades:u, refs:r, falta:Math.max(0, CAT.minimo-st), faltaEnvio:Math.max(0, e.gratisDesde-st), flete:flete, am:am, total:st+flete };
  }
  function pintarBarra(inicial){
    var t=totales(), e=CAT.envio, techo=Math.max(e.gratisDesde, CAT.minimo);
    $('barra').classList.toggle('on', t.refs>0);
    var pMin=100*CAT.minimo/techo, pAct=Math.min(100, 100*t.subtotal/techo);
    var f1=$('prog').querySelector('.f1'), f2=$('prog').querySelector('.f2');
    f1.style.width=Math.min(pAct,pMin)+'%';
    f2.style.left=pMin+'%'; f2.style.width=Math.max(0,pAct-pMin)+'%';
    $('hito').style.left=pMin+'%';
    $('hitos').innerHTML='<span style="left:'+pMin+'%"'+(t.falta?'':' class="ok"')+'>'+(t.falta?'':'✓ ')+'Mínimo '+cop(CAT.minimo)+'</span>'
      +'<span class="fin'+(t.faltaEnvio?'':' ok')+'">🚚 Gratis '+cop(e.gratisDesde)+'</span>';
    var estado = t.falta ? 0 : (t.faltaEnvio ? 1 : 2), linea;
    if(estado===0) linea='Te faltan '+cop(t.falta)+' para el pedido mínimo';
    else if(estado===1) linea='✓ Mínimo listo · te faltan '+cop(t.faltaEnvio)+' para envío gratis 🚚';
    else linea='🚚 ¡Tu pedido tiene envío gratis!';
    $('barraTxt').innerHTML='<b>'+cop(t.subtotal)+'</b>'+t.unidades+' unidades · '+linea;
    // Celebración al pasar un hito (mínimo o envío gratis)
    if(!inicial && ESTADO_BARRA>=0 && estado>ESTADO_BARRA){
      SON.hito(); vibrar([10,40,10]);
      var p=$('prog'); p.classList.remove('celebra'); void p.offsetWidth; p.classList.add('celebra');
      aviso(estado===1 ? '🎉 ¡Pedido mínimo alcanzado!' : '🚚 ¡Genial! Tu pedido ya tiene envío gratis');
    }
    ESTADO_BARRA=estado;
  }

  /* ——— Pedido ——— */
  function pintarCuentas(){
    var box=$('cuentas'); if(!box) return;
    var t=totales(($('cCiudad')||{}).value), envio;
    if(t.flete===0) envio = t.am ? '<span class="g">¡Gratis! · mensajería KAÉM 🏙️</span>' : '<span class="g">¡Gratis! 🚚</span>';
    else envio = cop(t.flete);
    box.innerHTML='<div><span>Subtotal · '+t.unidades+' unidades</span><span>'+cop(t.subtotal)+'</span></div>'
      +'<div><span>Envío</span>'+envio+'</div>'
      +'<div class="tot"><span>Total</span><b>'+cop(t.total)+'</b></div>';
    var pista=$('pistaEnvio');
    if(pista){
      if(t.flete && t.faltaEnvio) pista.textContent='💡 Agrega '+cop(t.faltaEnvio)+' más y el envío te sale gratis.';
      else if(t.flete && CAT.envio.amGratis) pista.textContent='💡 En Bucaramanga, Floridablanca, Girón y Piedecuesta el envío es gratis.';
      else pista.textContent='';
    }
  }
  function pintarHoja(){
    var t=totales(), c=leer('kaem_cliente')||{}, h='<h2>Tu pedido 🛍️<button class="cerrar" id="cerrarHoja" aria-label="Cerrar">✕</button></h2>';
    if(!t.refs){ h+='<p class="vacio">Tu pedido está vacío. ¡Agrega tus favoritos! ✨</p>'; $('hojaIn').innerHTML=h; return; }
    Object.keys(CARRITO).forEach(function(s){ var x=VAR[s]; if(!x) return;
      h+='<div class="it"><div class="t">'+esc(x.g.nombre)+(x.v.tono?' · '+esc(x.v.tono):'')+'<small>'+esc(x.g.marca)+' · '+cop(x.v.precio)+' c/u · '+cop(x.v.precio*CARRITO[s])+'</small></div>'
        +'<div class="paso"><button data-menos="'+esc(s)+'" aria-label="Quitar una">−</button><b'+(s===ULTIMO?' class="bump"':'')+'>'+CARRITO[s]+'</b><button data-mas="'+esc(s)+'" aria-label="Agregar una">+</button></div></div>';
    });
    h+='<div class="cuentas" id="cuentas"></div><p class="pista" id="pistaEnvio"></p>';
    h+= t.falta ? '<p class="falta">Te faltan '+cop(t.falta)+' para el pedido mínimo de '+cop(CAT.minimo)+'.</p>' : '';
    var campo=function(id,lbl,val,tipo,extra){ return '<div class="campo"><label for="'+id+'">'+lbl+'</label><input id="'+id+'" type="'+(tipo||'text')+'" value="'+esc(val||'')+'" '+(extra||'')+'></div>'; };
    h+='<p style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);margin:18px 0 0">📦 Datos de entrega</p>'
      +campo('cNombre','Nombre o negocio',c.nombre,'text','autocomplete="name" maxlength="80"')
      +campo('cNit','Cédula o NIT',c.nit,'text','inputmode="numeric" maxlength="20"')
      +campo('cTel','Celular (WhatsApp) · 10 dígitos',String(c.telefono||'').replace(/\D/g,'').slice(-10),'tel','inputmode="numeric" autocomplete="tel-national" pattern="3[0-9]{9}" placeholder="3001234567"')
      +campo('cCiudad','Ciudad',c.ciudad,'text','list="ciudadesAM" maxlength="60"')
      +'<datalist id="ciudadesAM">'+(CAT.envio.ciudadesAM||[]).map(function(x){ return '<option value="'+esc(x)+'">'; }).join('')+'</datalist>'
      +campo('cDir','Dirección de entrega completa',c.direccion,'text','autocomplete="street-address" maxlength="140" placeholder="Calle, número, barrio, apto o local"')
      +'<div class="campo"><label for="cNotas">Notas (opcional)</label><textarea id="cNotas" rows="2" maxlength="300" placeholder="Horario de entrega, indicaciones…"></textarea></div>'
      +'<input class="trampa" id="cWeb" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">'
      +'<button class="btn" id="enviar" type="button" style="width:100%;margin-top:6px"'+(t.falta?' disabled':'')+'>'+(t.falta?'Completa el pedido mínimo':'Enviar pedido ✨')+'</button>'
      +'<p style="text-align:center;font-size:12px;color:var(--suave);margin:10px 0 0;line-height:1.5">Tu pedido llega directo a KAÉM 🤎 Te escribimos por WhatsApp para confirmar el pago y el envío.</p>';
    $('hojaIn').innerHTML=h; pintarCuentas();
  }
  function enviar(){
    var val=function(id){ return String(($(id)||{}).value||'').trim(); };
    var cli={ nombre:val('cNombre'), nit:val('cNit'), telefono:val('cTel'), ciudad:val('cCiudad'), direccion:val('cDir') };
    guardar('kaem_cliente', cli);
    if(!/^3\d{9}$/.test(cli.telefono)){ aviso('📱 Escribe tu celular de 10 dígitos (empieza por 3).'); var t=$('cTel'); t.classList.remove('mal'); void t.offsetWidth; t.classList.add('mal'); t.focus(); SON.error(); return; }
    var b=$('enviar'); b.disabled=true; b.textContent='Enviando… ⏳';
    var items=Object.keys(CARRITO).map(function(s){ return { sku:s, cantidad:CARRITO[s] }; });
    api('enviarPedidoCatalogo', { clave:CLAVE, cliente:cli, items:items, notas:val('cNotas'), web:val('cWeb') }).then(function(r){
      if(!r || !r.ok){
        b.disabled=false; b.textContent='Enviar pedido ✨'; SON.error(); vibrar(40); aviso((r&&r.message)||'No se pudo enviar el pedido.');
        var mapa={ nombre:'cNombre', nit:'cNit', telefono:'cTel', ciudad:'cCiudad', direccion:'cDir' };
        if(r && r.campo && mapa[r.campo]){ var el=$(mapa[r.campo]); el.classList.remove('mal'); void el.offsetWidth; el.classList.add('mal'); el.focus(); }
        return;
      }
      var nombreItem=function(i){ return i.nombre+(i.tono && i.nombre.toUpperCase().indexOf(i.tono.toUpperCase())<0 ? ' · '+i.tono : ''); };
      var envioTxt = r.flete ? cop(r.flete) : (r.envioPropio ? '¡Gratis! (mensajería KAÉM) 🏙' : '¡Gratis! 🎉');
      var txt='✨ *¡Hola, KAÉM!* Te envío mi pedido 🛍\n\n'
        + '🧾 *Pedido '+r.id+'* · Catálogo '+r.nivel+'\n\n'
        + '*Productos*\n'
        + r.items.map(function(i){ return '• '+i.cantidad+' × '+nombreItem(i)+' — '+cop(i.subtotal); }).join('\n')
        + '\n\n💰 Subtotal: '+cop(r.subtotal)+'\n🚚 Envío: '+envioTxt+'\n💳 *Total: '+cop(r.total)+'* · '+r.unidades+' unidades\n\n'
        + '📦 *Datos de entrega*\n👤 '+cli.nombre+'\n🪪 C.C./NIT: '+cli.nit+'\n📱 '+cli.telefono+'\n📍 '+cli.ciudad+'\n🏠 '+cli.direccion
        + (val('cNotas') ? '\n📝 '+val('cNotas') : '')
        + '\n\nQuedo atento(a) a la confirmación y los datos de pago. ¡Gracias! 🤎';
      txt = txt.replace(/\uFE0F/g,'');   // los selectores de variación invisibles son lo primero que se daña
      var wa='https://api.whatsapp.com/send?phone='+CAT.whatsapp+'&text='+encodeURIComponent(txt);
      CARRITO={}; guardar('kaem_carrito_'+CLAVE, CARRITO); pintar(false); pintarBarra(true);
      SON.enviado(); vibrar([15,50,15]);
      $('hoja')._exito=true;
      var primer=cli.nombre.split(' ')[0]; primer=primer.charAt(0).toUpperCase()+primer.slice(1).toLowerCase();
      $('hojaIn').innerHTML='<div class="ok-box"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"/><path d="M19 33l9 9 17-19"/></svg>'
        +'<h3>¡Listo, '+esc(primer)+'!</h3><p>Tu pedido <b>'+esc(r.id)+'</b> llegó a KAÉM 🤎<br>Total '+cop(r.total)+' · '+r.unidades+' unidades'+(r.flete?'':' · envío gratis 🚚')+'</p>'
        +'<p>Envíalo también por WhatsApp para confirmarlo más rápido 👇</p>'
        +'<a class="btn wa" href="'+esc(wa)+'" target="_blank" rel="noopener noreferrer" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20l1.3-5A8.4 8.4 0 1 1 21 11.5z"/></svg>Enviar por WhatsApp</a>'
        +'<button class="btn" id="cerrarHoja" type="button" style="width:100%;margin-top:10px;background:var(--arena);color:var(--espresso)">Seguir viendo el catálogo</button></div>';
    }).catch(function(){ b.disabled=false; b.textContent='Enviar pedido ✨'; SON.error(); aviso('No pudimos conectar 📶 Revisa tu internet e intenta de nuevo; tu pedido sigue guardado.'); });
  }

  /* ——— Eventos ——— */
  $('q').addEventListener('input', function(){ FILTRO.q=this.value; pintar(true); });
  $('chips').addEventListener('click', function(e){ var b=e.target.closest('[data-m]'); if(!b) return; FILTRO.marca=b.getAttribute('data-m'); SON.tono(); pintarChips(); pintar(true); });
  $('sonido').addEventListener('click', function(){ SON.alternar(); pintarSonido(); });
  document.addEventListener('click', function(e){
    var t=e.target;
    var tono=t.closest && t.closest('.tono'); if(tono){ TONO_SEL[tono.getAttribute('data-g')]=tono.getAttribute('data-s'); SON.tono(); pintar(false); return; }
    var mas=t.closest && t.closest('[data-mas]'); if(mas){ cambiar(mas.getAttribute('data-mas'), 1); return; }
    var menos=t.closest && t.closest('[data-menos]'); if(menos){ cambiar(menos.getAttribute('data-menos'), -1); return; }
    if(t.id==='verPedido'){ $('hoja')._exito=false; pintarHoja(); $('hoja').classList.add('on'); SON.tono(); return; }
    if(t.id==='cerrarHoja' || t.id==='hoja'){ $('hoja').classList.remove('on'); return; }
    if(t.id==='enviar'){ enviar(); return; }
  });
  $('hojaIn').addEventListener('input', function(e){
    if(e.target.classList) e.target.classList.remove('mal');
    // Solo números, máximo 10; si pegan "+57 300 123 4567" se quita el 57 (sin maxlength: cortaba lo pegado)
    if(e.target.id==='cTel'){ var d=e.target.value.replace(/\D/g,''); if(d.length>10 && d.indexOf('57')===0) d=d.slice(2); d=d.slice(0,10); if(e.target.value!==d) e.target.value=d; }
    if(e.target.id==='cCiudad') pintarCuentas();
  });
  // Fotos: aparecen con un fundido al cargar; si una falla, queda la tarjeta con la marca (sin código en línea)
  document.addEventListener('load', function(e){ if(e.target.tagName==='IMG') e.target.classList.add('lista'); }, true);
  document.addEventListener('error', function(e){
    var im=e.target; if(im.tagName!=='IMG' || !im.parentNode) return;
    var box=im.parentNode, s=document.createElement('span'); s.className='ph'; s.textContent=box.getAttribute('data-marca')||'KAÉM';
    box.innerHTML=''; box.appendChild(s);
  }, true);
  pintarSonido();
  cargar();
})();
</script>
</body>
</html>
