<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3ECE3">
<title>KAÉM · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--crema:#F3ECE3;--crema-2:#EFE7DC;--blanco:#FFFFFF;--linea:#E4DACE;--texto-suave:#726559;
        --espresso:#3B2C25;--terracota:#A66750;--salvia:#778070;--rojo:#B4553F}
  *{box-sizing:border-box}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  html,body{margin:0;background:var(--crema);color:var(--espresso);font-family:'Jost',system-ui,sans-serif}
  button,input,textarea{font-family:inherit;touch-action:manipulation}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
  header{padding:calc(22px + env(safe-area-inset-top)) 0 10px;text-align:center}
  .marca{font-family:'Playfair Display',serif;font-size:30px;letter-spacing:.34em;margin:0 0 2px;padding-left:.34em}
  .sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--texto-suave);margin:0}
  .nivel{display:inline-block;margin:14px 0 4px;padding:6px 14px;border-radius:20px;background:var(--espresso);color:var(--crema);font-size:12.5px;letter-spacing:.06em}
  .reglas{font-size:12.5px;color:var(--texto-suave);margin:6px 0 0;line-height:1.5}
  .buscar{position:sticky;top:0;z-index:5;background:var(--crema);padding:12px 0 8px}
  .buscar input{width:100%;font-size:16px;padding:13px 16px;border-radius:14px;border:1px solid var(--linea);background:var(--blanco);color:var(--espresso);outline:none}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--linea);background:var(--blanco);font-size:13px;color:var(--espresso);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--espresso);color:var(--crema);border-color:var(--espresso)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .card{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
  .foto{aspect-ratio:1/1;background:var(--crema-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover}
  .foto .ph{font-family:'Playfair Display',serif;font-size:13px;letter-spacing:.2em;color:var(--texto-suave);text-align:center;padding:10px}
  .info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .mk{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-suave)}
  .nom{font-family:'Playfair Display',serif;font-size:14.5px;line-height:1.25;margin:0}
  .tonos{display:flex;flex-wrap:wrap;gap:5px}
  .tono{font-size:11px;padding:4px 9px;border-radius:14px;border:1px solid var(--linea);background:var(--crema);cursor:pointer;color:var(--espresso)}
  .tono.on{border-color:var(--terracota);background:rgba(166,103,80,.1);font-weight:600}
  .tono .n{display:inline-block;min-width:15px;margin-left:4px;padding:0 4px;border-radius:8px;background:var(--terracota);color:#fff;font-size:10px;text-align:center}
  .pie{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .precio{font-family:'Playfair Display',serif;font-size:17px}
  .etq{font-size:10.5px;padding:3px 8px;border-radius:10px;background:rgba(119,128,112,.14);color:var(--salvia);white-space:nowrap}
  .etq.pocas{background:rgba(166,103,80,.13);color:var(--terracota)}
  .agregar{width:100%;padding:10px;border-radius:12px;border:none;background:var(--espresso);color:var(--crema);font-size:14px;cursor:pointer}
  .paso{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--espresso);border-radius:12px;overflow:hidden}
  .paso button{width:42px;height:40px;border:none;background:var(--espresso);color:var(--crema);font-size:20px;cursor:pointer}
  .paso b{font-size:15px}
  .vacio{text-align:center;color:var(--texto-suave);padding:40px 10px;font-size:14px}
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
         border-top:1px solid var(--linea);padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:none}
  .barra.on{display:block}
  .barra-in{max-width:1100px;margin:0 auto}
  .prog{height:6px;border-radius:6px;background:var(--crema-2);overflow:hidden;margin-bottom:8px}
  .prog i{display:block;height:100%;background:var(--terracota);transition:width .3s}
  .prog.ok i{background:var(--salvia)}
  .barra-fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .barra-txt{font-size:12.5px;color:var(--texto-suave);line-height:1.35}
  .barra-txt b{display:block;font-family:'Playfair Display',serif;font-size:19px;color:var(--espresso)}
  .btn{padding:13px 20px;border-radius:14px;border:none;background:var(--espresso);color:var(--crema);font-size:15px;cursor:pointer;white-space:nowrap}
  .btn:disabled{opacity:.45}
  .btn.wa{background:#25D366;color:#fff;width:100%;font-size:16px}
  .hoja{position:fixed;inset:0;z-index:30;background:rgba(44,33,30,.45);display:none;align-items:flex-end;justify-content:center}
  .hoja.on{display:flex}
  .hoja-in{background:var(--crema);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  .hoja h2{font-family:'Playfair Display',serif;font-weight:400;font-size:22px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .cerrar{border:none;background:var(--crema-2);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--espresso)}
  .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
  .it .t{flex:1;min-width:0;font-size:13px;line-height:1.35}
  .it .t small{display:block;color:var(--texto-suave)}
  .it .paso{flex:0 0 118px}
  .it .paso button{width:36px;height:34px;font-size:17px}
  .tot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px}
  .tot b{font-family:'Playfair Display',serif;font-size:22px}
  .falta{font-size:12.5px;color:var(--terracota);margin:0 0 10px}
  .campo{margin:10px 0}
  .campo label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-suave);margin:0 0 5px}
  .campo input,.campo textarea{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--blanco);color:var(--espresso);outline:none}
  .campo input.mal{border-color:var(--rojo)}
  .aviso{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;max-width:92vw;
         background:var(--espresso);color:var(--crema);padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.4;display:none;box-shadow:0 8px 30px rgba(0,0,0,.2)}
  .aviso.on{display:block}
  .ok-box{text-align:center;padding:10px 4px}
  .ok-box .ic{font-size:44px}
  .ok-box h3{font-family:'Playfair Display',serif;font-weight:400;font-size:24px;margin:6px 0}
  .ok-box p{color:var(--texto-suave);font-size:14px;line-height:1.5}
  .cargando{text-align:center;padding:60px 10px;color:var(--texto-suave)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="marca">KAÉM</p>
    <p class="sub">Beauty House</p>
    <span class="nivel" id="nivel">Catálogo</span>
    <p class="reglas" id="reglas"></p>
  </header>
  <div class="buscar">
    <input id="q" type="search" placeholder="Buscar producto, marca o tono…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="estado" class="cargando">Cargando catálogo…</div>
</div>

<div class="barra" id="barra"><div class="barra-in">
  <div class="prog" id="prog"><i></i></div>
  <div class="barra-fila">
    <div class="barra-txt" id="barraTxt"></div>
    <button class="btn" id="verPedido" type="button">Ver pedido</button>
  </div>
</div></div>

<div class="hoja" id="hoja"><div class="hoja-in" id="hojaIn"></div></div>
<div class="aviso" id="aviso"></div>

<script>
(function(){
  var API_URL = "https://script.google.com/macros/s/AKfycbxmXydJ_8gBqVZZ7rx8mCPZc5u80pyMj30o52I993rxdWotODEhTwwfEo05PNKf4OiiZA/exec";
  var CLAVE = new URLSearchParams(location.search).get('k') || '';
  var CAT = null, CARRITO = {}, VAR = {}, FILTRO = { q:'', marca:'' }, TONO_SEL = {};
  var $ = function(id){ return document.getElementById(id); };
  var cop = function(n){ return '$' + Math.round(n||0).toLocaleString('es-CO'); };
  var esc = function(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var guardar = function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  var leer = function(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };

  function aviso(msg){ var a=$('aviso'); a.textContent=msg; a.classList.add('on'); clearTimeout(a._t); a._t=setTimeout(function(){ a.classList.remove('on'); }, Math.min(8000, 2500+msg.length*45)); }
  function api(action, data){
    return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, redirect:'follow', cache:'no-store',
      body: JSON.stringify({ action:action, data:data }) }).then(function(r){ return r.text(); }).then(function(t){ return JSON.parse(t); });
  }

  /* ——— Carga: primero lo guardado (instantáneo), luego lo fresco del servidor ——— */
  function cargar(){
    if(!CLAVE){ $('estado').textContent='Este enlace está incompleto. Pídele a KAÉM el enlace de tu catálogo.'; return; }
    var previo = leer('kaem_cat_'+CLAVE);
    if(previo && previo.ok) aplicar(previo, true);
    api('catalogoPublico', { clave:CLAVE }).then(function(r){
      if(!r || !r.ok){ if(!previo){ $('estado').textContent=(r&&r.message)||'No se pudo cargar el catálogo.'; } else aviso((r&&r.message)||'No se pudo actualizar el catálogo.'); return; }
      guardar('kaem_cat_'+CLAVE, r); aplicar(r, false);
    }).catch(function(){
      if(!previo) $('estado').innerHTML='No se pudo conectar. Revisa tu internet y <a href="" style="color:inherit">vuelve a intentar</a>.';
    });
  }
  function aplicar(r, desdeCache){
    CAT = r; VAR = {};
    r.productos.forEach(function(g){ g.variantes.forEach(function(v){ VAR[v.sku] = { g:g, v:v }; }); });
    // El carrito guardado solo conserva lo que sigue disponible
    var c = leer('kaem_carrito_'+CLAVE) || {}; CARRITO = {};
    Object.keys(c).forEach(function(s){ if(VAR[s] && c[s]>0) CARRITO[s]=c[s]; });
    $('nivel').textContent = 'Catálogo ' + r.nivel;
    $('reglas').textContent = 'Precios ' + r.nivel.toLowerCase() + ' · pedido mínimo ' + cop(r.minimo) + (r.minPorRef>1 ? ' · mínimo ' + r.minPorRef + ' unidades por referencia' : '');
    pintarChips(); pintar(); pintarBarra();
  }

  /* ——— Catálogo ——— */
  function pintarChips(){
    var h='<button class="chip'+(FILTRO.marca?'':' on')+'" data-m="">Todas</button>';
    CAT.marcas.forEach(function(m){ h+='<button class="chip'+(FILTRO.marca===m?' on':'')+'" data-m="'+esc(m)+'">'+esc(m)+'</button>'; });
    $('chips').innerHTML=h;
  }
  function cantDeGrupo(g){ return g.variantes.reduce(function(t,v){ return t+(CARRITO[v.sku]||0); },0); }
  function pintar(){
    var q=FILTRO.q.trim().toLowerCase(), h='', n=0;
    CAT.productos.forEach(function(g){
      if(FILTRO.marca && g.marca!==FILTRO.marca) return;
      if(q && (g.nombre+' '+g.marca+' '+g.variantes.map(function(v){return v.tono;}).join(' ')).toLowerCase().indexOf(q)<0) return;
      n++;
      var sel = TONO_SEL[g.id] && VAR[TONO_SEL[g.id]] ? TONO_SEL[g.id] : g.variantes[0].sku;
      var v = VAR[sel].v, foto = v.foto || g.foto;
      var tonos = (g.variantes.length>1 || v.tono) ? '<div class="tonos">'+g.variantes.map(function(x){
        var c=CARRITO[x.sku]||0;
        return '<button class="tono'+(x.sku===sel?' on':'')+'" data-g="'+esc(g.id)+'" data-s="'+esc(x.sku)+'">'+esc(x.tono||'Único')+(c?'<span class="n">'+c+'</span>':'')+'</button>';
      }).join('')+'</div>' : '';
      var cant = CARRITO[sel]||0;
      var accion = cant ? '<div class="paso"><button data-menos="'+esc(sel)+'" aria-label="Quitar">−</button><b>'+cant+'</b><button data-mas="'+esc(sel)+'" aria-label="Agregar">+</button></div>'
                        : '<button class="agregar" data-mas="'+esc(sel)+'">Agregar'+(CAT.minPorRef>1?' '+CAT.minPorRef:'')+'</button>';
      h+='<div class="card"><div class="foto">'+(foto?'<img src="'+esc(foto)+'" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'<span class=ph>'+esc(g.marca)+'</span>\'">':'<span class="ph">'+esc(g.marca)+'</span>')+'</div>'
        +'<div class="info"><span class="mk">'+esc(g.marca)+'</span><p class="nom">'+esc(g.nombre)+'</p>'+tonos
        +'<div class="pie"><span class="precio">'+cop(v.precio)+'</span><span class="etq'+(v.etiqueta!=='Disponible'?' pocas':'')+'">'+esc(v.etiqueta)+'</span></div>'
        +accion+'</div></div>';
    });
    $('grid').innerHTML=h;
    $('estado').style.display = n ? 'none' : 'block';
    if(!n){ $('estado').className='vacio'; $('estado').textContent = CAT.productos.length ? 'No hay productos que coincidan con tu búsqueda.' : 'No hay productos disponibles en este momento.'; }
  }
  function cambiar(sku, delta){
    var min=CAT.minPorRef, c=CARRITO[sku]||0;
    if(delta>0) c = c ? c+1 : min;                    // el primer toque agrega el mínimo por referencia
    else c = (c-1 < min) ? 0 : c-1;                   // por debajo del mínimo, sale del carrito
    if(c) CARRITO[sku]=c; else delete CARRITO[sku];
    guardar('kaem_carrito_'+CLAVE, CARRITO);
    if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
    pintar(); pintarBarra(); if($('hoja').classList.contains('on') && !$('hoja')._exito) pintarHoja();
  }
  function totales(){
    var t=0,u=0,r=0; Object.keys(CARRITO).forEach(function(s){ if(!VAR[s]) return; t+=VAR[s].v.precio*CARRITO[s]; u+=CARRITO[s]; r++; });
    return { total:t, unidades:u, refs:r, falta:Math.max(0, CAT.minimo-t) };
  }
  function pintarBarra(){
    var t=totales(); $('barra').classList.toggle('on', t.refs>0);
    var pct=Math.min(100, Math.round(100*t.total/CAT.minimo));
    $('prog').firstChild.style.width=pct+'%'; $('prog').classList.toggle('ok', !t.falta);
    $('barraTxt').innerHTML='<b>'+cop(t.total)+'</b>'+t.unidades+' unidades · '+(t.falta?'faltan '+cop(t.falta)+' para el mínimo':'✓ pedido mínimo alcanzado');
  }

  /* ——— Pedido ——— */
  function pintarHoja(){
    var t=totales(), c=leer('kaem_cliente')||{}, h='<h2>Tu pedido<button class="cerrar" id="cerrarHoja" aria-label="Cerrar">✕</button></h2>';
    if(!t.refs){ h+='<p class="vacio">Tu pedido está vacío.</p>'; $('hojaIn').innerHTML=h; return; }
    Object.keys(CARRITO).forEach(function(s){ var x=VAR[s]; if(!x) return;
      h+='<div class="it"><div class="t">'+esc(x.g.nombre)+(x.v.tono?' · '+esc(x.v.tono):'')+'<small>'+esc(x.g.marca)+' · '+cop(x.v.precio)+' c/u · '+cop(x.v.precio*CARRITO[s])+'</small></div>'
        +'<div class="paso"><button data-menos="'+esc(s)+'">−</button><b>'+CARRITO[s]+'</b><button data-mas="'+esc(s)+'">+</button></div></div>';
    });
    h+='<div class="tot"><span>'+t.unidades+' unidades</span><b>'+cop(t.total)+'</b></div>';
    h+= t.falta ? '<p class="falta">Te faltan '+cop(t.falta)+' para el pedido mínimo de '+cop(CAT.minimo)+'.</p>' : '';
    var campo=function(id,lbl,val,tipo,extra){ return '<div class="campo"><label for="'+id+'">'+lbl+'</label><input id="'+id+'" type="'+(tipo||'text')+'" value="'+esc(val||'')+'" '+(extra||'')+'></div>'; };
    h+='<p style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-suave);margin:18px 0 0">Datos de entrega</p>'
      +campo('cNombre','Nombre o negocio',c.nombre,'text','autocomplete="name"')
      +campo('cNit','Cédula o NIT',c.nit,'text','inputmode="numeric"')
      +campo('cTel','Celular',c.telefono,'tel','inputmode="tel" autocomplete="tel"')
      +campo('cCiudad','Ciudad',c.ciudad)
      +campo('cDir','Dirección de entrega',c.direccion,'text','autocomplete="street-address"')
      +'<div class="campo"><label for="cNotas">Notas (opcional)</label><textarea id="cNotas" rows="2" placeholder="Horario de entrega, indicaciones…"></textarea></div>'
      +'<button class="btn" id="enviar" type="button" style="width:100%;margin-top:6px"'+(t.falta?' disabled':'')+'>'+(t.falta?'Falta completar el mínimo':'Enviar pedido')+'</button>'
      +'<p class="reglas" style="text-align:center;margin-top:10px">Tu pedido llega a KAÉM para confirmarlo. Te contactamos por WhatsApp para el pago y el envío.</p>';
    $('hojaIn').innerHTML=h;
  }
  function enviar(){
    var val=function(id){ return String(($(id)||{}).value||'').trim(); };
    var cli={ nombre:val('cNombre'), nit:val('cNit'), telefono:val('cTel'), ciudad:val('cCiudad'), direccion:val('cDir') };
    guardar('kaem_cliente', cli);
    var b=$('enviar'); b.disabled=true; b.textContent='Enviando…';
    var items=Object.keys(CARRITO).map(function(s){ return { sku:s, cantidad:CARRITO[s] }; });
    api('enviarPedidoCatalogo', { clave:CLAVE, cliente:cli, items:items, notas:val('cNotas') }).then(function(r){
      if(!r || !r.ok){
        b.disabled=false; b.textContent='Enviar pedido'; aviso((r&&r.message)||'No se pudo enviar el pedido.');
        var mapaCampo={ nombre:'cNombre', nit:'cNit', telefono:'cTel', ciudad:'cCiudad', direccion:'cDir' };
        if(r && r.campo && mapaCampo[r.campo]){ var el=$(mapaCampo[r.campo]); el.classList.add('mal'); el.focus(); }
        return;
      }
      var txt='Hola KAÉM 👋 Te envío mi pedido *'+r.id+'* ('+r.nivel+'):\n\n'
        + r.items.map(function(i){ return '• '+i.cantidad+' × '+i.nombre+(i.tono && i.nombre.toUpperCase().indexOf(i.tono.toUpperCase())<0?' ('+i.tono+')':'')+' — '+cop(i.subtotal); }).join('\n')
        + '\n\n*Total: '+cop(r.total)+'* · '+r.unidades+' unidades\n\n'
        + 'Nombre: '+cli.nombre+'\nCédula/NIT: '+cli.nit+'\nCiudad: '+cli.ciudad+'\nDirección: '+cli.direccion+(val('cNotas')?'\nNotas: '+val('cNotas'):'');
      var wa='https://wa.me/'+CAT.whatsapp+'?text='+encodeURIComponent(txt);
      CARRITO={}; guardar('kaem_carrito_'+CLAVE, CARRITO); pintar(); pintarBarra();
      $('hoja')._exito=true;
      $('hojaIn').innerHTML='<div class="ok-box"><div class="ic">✓</div><h3>Pedido '+esc(r.id)+' recibido</h3>'
        +'<p>Total '+cop(r.total)+' · '+r.unidades+' unidades.<br>Envíalo también por WhatsApp para que lo confirmemos más rápido.</p>'
        +'<a class="btn wa" href="'+wa+'" style="display:block;text-decoration:none;margin-top:14px">Enviar por WhatsApp</a>'
        +'<button class="btn" id="cerrarHoja" type="button" style="width:100%;margin-top:10px;background:var(--crema-2);color:var(--espresso)">Seguir viendo el catálogo</button></div>';
    }).catch(function(){ b.disabled=false; b.textContent='Enviar pedido'; aviso('No se pudo conectar. Revisa tu internet e intenta de nuevo; tu pedido sigue guardado.'); });
  }

  /* ——— Eventos ——— */
  $('q').addEventListener('input', function(){ FILTRO.q=this.value; pintar(); });
  $('chips').addEventListener('click', function(e){ var b=e.target.closest('[data-m]'); if(!b) return; FILTRO.marca=b.getAttribute('data-m'); pintarChips(); pintar(); });
  document.addEventListener('click', function(e){
    var t=e.target;
    var tono=t.closest && t.closest('.tono'); if(tono){ TONO_SEL[tono.getAttribute('data-g')]=tono.getAttribute('data-s'); pintar(); return; }
    var mas=t.closest && t.closest('[data-mas]'); if(mas){ cambiar(mas.getAttribute('data-mas'), 1); return; }
    var menos=t.closest && t.closest('[data-menos]'); if(menos){ cambiar(menos.getAttribute('data-menos'), -1); return; }
    if(t.id==='verPedido'){ $('hoja')._exito=false; pintarHoja(); $('hoja').classList.add('on'); return; }
    if(t.id==='cerrarHoja' || t.id==='hoja'){ $('hoja').classList.remove('on'); return; }
    if(t.id==='enviar'){ enviar(); return; }
  });
  $('hojaIn').addEventListener('input', function(e){ if(e.target.classList) e.target.classList.remove('mal'); });
  cargar();
})();
</script>
</body>
</html>
