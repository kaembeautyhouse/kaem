<html lang="es">
<head>
<meta charset="UTF-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.shopify.com https://*.shopify.com https://*.shopifycdn.com; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">

<title>KAÉM Beauty House · Tienda</title>
<meta name="description" content="Maquillaje y skincare con envío a todo Colombia. Sin pedido mínimo, envío gratis en Bucaramanga y área metropolitana desde $100.000 y a todo el país desde $200.000.">
<meta property="og:type" content="website">

<meta property="og:title" content="KAÉM BEAUTY HOUSE · Tienda">
<meta property="og:description" content="Maquillaje y skincare. Sin pedido mínimo · envío gratis desde $100.000 en Bucaramanga y AM y desde $200.000 a todo el país.">
<meta property="og:image" content="https://kaembeautyhouse.github.io/kaem/og-catalogo.jpg">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com" crossorigin>
<link rel="preload" href="logo.png" as="image">
<style>
  /* ═══ Atelier · paleta KAÉM ═══ */
  :root{
    --crema:#F7F4EE; --arena:#E5DDD0; --piedra:#C2B6A6; --espresso:#2C211E; --blanco:#FFFFFF;
    --salvia:#8FA08E; --salvia-txt:#5E7160; --terracota:#B86B53; --terracota-txt:#9E5842; --suave:#6B5B52; --rojo:#A94B36;
    --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.2,.8,.2,1);
    --r:14px; --sombra:0 10px 40px rgba(44,33,30,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation;scroll-behavior:smooth}
  html,body{margin:0;background:var(--crema);color:var(--espresso);font-family:var(--sans);line-height:1.5}
  body.bloqueado{overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;padding:0}
  img{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--terracota);outline-offset:2px;border-radius:6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}

  /* ═══ Cinta de beneficios y cabecera ═══ */
  .cinta{background:var(--espresso);color:var(--crema);font-size:11.5px;letter-spacing:.06em;text-align:center;padding:8px 14px calc(8px) ;line-height:1.35}
  .cinta b{font-weight:500;color:#E8C29E}
  header.top{position:relative;padding:14px 0 6px;text-align:center}
  .wm{display:block;text-align:center;font:600 1.5rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase}.wm i{display:block;font-size:.55em;letter-spacing:.32em;font-weight:400;margin-top:4px}
  .logo{display:block;margin:0 auto;width:min(190px,48vw);height:auto;aspect-ratio:2298/1134}
  .acciones{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:4px}
  .ico{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s var(--ease-out)}
  .ico:active{transform:scale(.92)}
  .ico svg{width:22px;height:22px;stroke:var(--espresso);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ico .n{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--terracota);color:#fff;font-size:10.5px;line-height:17px;text-align:center;padding:0 4px;font-weight:600;transform:scale(0);transition:transform .3s var(--ease)}
  .ico .n.on{transform:scale(1)}
  .ico.bump{animation:bump .35s var(--ease)}
  @keyframes bump{40%{transform:scale(1.18)}}
  .lema{text-align:center;margin:2px 0 14px}
  .lema p{margin:0;font-family:var(--sans);font-style:italic;font-size:15.5px;color:var(--suave)}

  /* ═══ Barra de búsqueda y filtros ═══ */
  .barra-top{position:sticky;top:0;z-index:20;background:rgba(247,244,238,.92);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);padding:10px 0 8px;border-bottom:1px solid transparent;transition:border-color .2s}
  .barra-top.sombra{border-bottom-color:var(--arena)}
  .fila-b{display:flex;gap:8px}
  .buscar{flex:1;position:relative}
  .buscar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--suave);fill:none;stroke-width:1.7;pointer-events:none}
  .buscar input{width:100%;font-size:16px;padding:12px 14px 12px 42px;border-radius:999px;border:1px solid var(--piedra);background:var(--blanco);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
  .buscar input:focus{border-color:var(--terracota);box-shadow:0 0 0 3px rgba(184,107,83,.14)}
  .buscar input::-webkit-search-cancel-button{display:none}
  .btn-filtro{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:0 16px;border-radius:999px;border:1px solid var(--piedra);background:var(--blanco);font-size:14px;min-height:46px;transition:transform .15s var(--ease-out)}
  .btn-filtro:active{transform:scale(.96)}
  .btn-filtro svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
  .btn-filtro .c{min-width:18px;height:18px;border-radius:9px;background:var(--terracota);color:#fff;font-size:11px;line-height:18px;text-align:center;display:none}
  .btn-filtro.act .c{display:inline-block}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 15px;border-radius:999px;border:1px solid var(--piedra);background:transparent;font-size:13.5px;white-space:nowrap;min-height:38px;transition:all .18s}
  .chip.on{background:var(--espresso);border-color:var(--espresso);color:var(--crema)}
  .resumen{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px;font-size:13px;color:var(--suave)}
  .resumen button{font-size:13px;color:var(--terracota-txt);text-decoration:underline;text-underline-offset:3px;min-height:32px}

  /* ═══ Rejilla de productos ═══ */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
  @media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px}}
  @media (min-width:1020px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .card{content-visibility:auto;contain-intrinsic-size:auto 330px;animation:entra .5s var(--ease-out) both;animation-delay:var(--d,0ms)}
  @keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--arena)}
  .ph .ver{position:absolute;inset:0;width:100%;height:100%}
  .ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .7s var(--ease-out)}
  .ph img.lista{opacity:1}
  @media (hover:hover) and (pointer:fine){.ph:hover img.lista{transform:scale(1.04)}}
  .ph .vacio{display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--sans);font-size:13px;letter-spacing:.2em;color:var(--suave);text-align:center;padding:10px}
  .fav{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease)}
  .fav:active{transform:scale(.85)}
  .fav svg{width:19px;height:19px;stroke:var(--espresso);fill:none;stroke-width:1.7;transition:fill .2s,stroke .2s}
  .fav[aria-pressed="true"] svg{fill:var(--terracota);stroke:var(--terracota)}
  .etq{position:absolute;left:8px;bottom:8px;font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--terracota-txt);letter-spacing:.02em}
  .fotos-n{position:absolute;left:8px;top:8px;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(44,33,30,.6);color:#fff}
  .cap{padding:10px 2px 0}
  .mk{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
  .nom{margin:2px 0 6px;font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.25;min-height:2.5em}
  .pr{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:9px}
  .precio{font-family:var(--sans);font-size:18px}
  .tn{font-size:12px;color:var(--suave)}
  .add{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--espresso);font-size:14px;letter-spacing:.02em;transition:background .2s,color .2s,transform .15s var(--ease-out)}
  .add:active{transform:scale(.97)}
  .add.solido{background:var(--espresso);color:var(--crema)}
  @media (hover:hover) and (pointer:fine){.add:hover{background:var(--espresso);color:var(--crema)}}
  .skel{aspect-ratio:4/5;border-radius:var(--r);background:linear-gradient(90deg,var(--arena) 0%,#EFE9DF 50%,var(--arena) 100%);background-size:200% 100%;animation:brillo 1.3s infinite}
  @keyframes brillo{to{background-position:-200% 0}}
  .estado{text-align:center;color:var(--suave);padding:56px 12px;font-size:15px}
  .estado b{display:block;font-family:var(--sans);font-weight:400;font-size:20px;color:var(--espresso);margin-bottom:6px}
  .mas{display:flex;justify-content:center;padding:26px 0 0}
  .mas button{padding:12px 28px;border-radius:999px;border:1px solid var(--piedra);font-size:14px}
  footer.pie{margin:46px 0 0;padding:26px 0 calc(130px + env(safe-area-inset-bottom));border-top:1px solid var(--arena);text-align:center;font-size:12.5px;color:var(--suave)}
  footer.pie p{margin:4px 0}

  /* ═══ Hojas (producto · bolsa · filtros) ═══ */
  .velo{position:fixed;inset:0;z-index:40;background:rgba(44,33,30,.5);opacity:0;pointer-events:none;transition:opacity .3s}
  .velo.on{opacity:1;pointer-events:auto}
  .hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94dvh;max-height:94vh;display:flex;flex-direction:column;background:var(--crema);border-radius:24px 24px 0 0;
        transform:translateY(105%);transition:transform .45s var(--ease);box-shadow:var(--sombra);visibility:hidden}
  .hoja.on{transform:none;visibility:visible}
  @media (min-width:820px){
    .hoja{left:50%;right:auto;bottom:auto;top:50%;width:min(1000px,94vw);max-height:90vh;border-radius:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .35s var(--ease),opacity .25s}
    .hoja.on{transform:translate(-50%,-50%);opacity:1}
    .hoja.angosta{width:min(520px,94vw)}
  }
  .hoja-cab{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
  .hoja-cab h2{margin:0;font-family:var(--sans);font-weight:400;font-size:22px}
  .x{width:40px;height:40px;border-radius:50%;background:var(--arena);display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .15s}
  .x:active{transform:scale(.9)}
  .hoja-cuerpo{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 16px 22px;flex:1}
  .hoja-pie{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--arena);background:var(--crema)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:999px;background:var(--espresso);color:var(--crema);font-size:16px;letter-spacing:.02em;transition:transform .15s var(--ease-out),opacity .2s,background .25s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5}
  .btn.ok{background:var(--salvia-txt)}
  .btn.claro{background:var(--arena);color:var(--espresso)}
  .btn.wa{background:#25D366;color:#fff;text-decoration:none}
  .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* Producto */
  .prod{display:grid;gap:18px}
  @media (min-width:820px){.prod{grid-template-columns:1.05fr 1fr;gap:34px;align-items:start}.hoja-cuerpo{padding:6px 28px 26px}}
  .gal{position:relative}
  .gal-pista{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;border-radius:var(--r);-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
  .gal-pista::-webkit-scrollbar{display:none}
  .gal-pista figure{flex:0 0 100%;margin:0;scroll-snap-align:center;aspect-ratio:4/5;background:var(--arena);position:relative}
  .gal-pista img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;cursor:zoom-in}
  .gal-pista img.lista{opacity:1}
  .puntos{display:flex;justify-content:center;gap:6px;margin-top:10px}
  .puntos i{width:6px;height:6px;border-radius:50%;background:var(--piedra);transition:all .25s var(--ease)}
  .puntos i.on{width:18px;border-radius:3px;background:var(--espresso)}
  .miniaturas{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .miniaturas::-webkit-scrollbar{display:none}
  .miniaturas button{flex:0 0 58px;height:72px;border-radius:10px;overflow:hidden;border:2px solid transparent;opacity:.7;transition:all .2s}
  .miniaturas button.on{border-color:var(--espresso);opacity:1}
  .miniaturas img{width:100%;height:100%;object-fit:cover}
  .gal-flecha{position:absolute;top:calc(50% - 22px);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:none;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .gal-flecha.i{left:10px}.gal-flecha.d{right:10px}
  @media (hover:hover) and (pointer:fine){.gal-flecha{display:flex}}
  .gal-flecha svg{width:18px;height:18px;stroke:var(--espresso);fill:none;stroke-width:2}
  .p-mk{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--suave)}
  .p-nom{margin:4px 0 8px;font-family:var(--sans);font-weight:400;font-size:27px;line-height:1.15}
  .p-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .p-precio{font-family:var(--sans);font-size:26px}
  .p-etq{font-size:12px;padding:5px 12px;border-radius:999px;background:rgba(143,160,142,.2);color:var(--salvia-txt)}
  .p-etq.pocas{background:rgba(184,107,83,.14);color:var(--terracota-txt)}
  .lbl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);margin:20px 0 9px}
  .lbl b{font-weight:500;color:var(--espresso);letter-spacing:.04em;text-transform:none;font-size:13px}
  .tonos{display:flex;flex-wrap:wrap;gap:8px}
  .tono{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;min-height:44px;border-radius:999px;border:1px solid var(--piedra);background:var(--blanco);font-size:13.5px;transition:all .18s}
  .tono.solo-texto{padding:6px 16px}
  .tono img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--arena)}
  .tono.on{border-color:var(--espresso);box-shadow:inset 0 0 0 1px var(--espresso);background:var(--blanco);font-weight:500}
  .tono.agot{opacity:.45}
  .cant{display:flex;align-items:center;gap:6px}
  .paso{display:inline-flex;align-items:center;border:1px solid var(--espresso);border-radius:999px;overflow:hidden}
  .paso button{width:44px;height:44px;font-size:20px;transition:background .15s}
  .paso button:active{background:var(--arena)}
  .paso b{min-width:34px;text-align:center;font-size:16px;font-weight:500}
  .garantias{display:grid;gap:8px;margin:20px 0 0;padding:14px;border-radius:var(--r);background:var(--blanco);border:1px solid var(--arena);font-size:13px;color:var(--suave)}
  .garantias div{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
  .garantias svg{flex:0 0 18px;width:18px;height:18px;stroke:var(--salvia-txt);fill:none;stroke-width:1.7;margin-top:1px;stroke-linecap:round;stroke-linejoin:round}
  .ficha{margin-top:6px}
  .ficha details{border-bottom:1px solid var(--arena)}
  .ficha summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:15px 2px;font-family:var(--sans);font-size:17px;min-height:50px}
  .ficha summary::-webkit-details-marker{display:none}
  .ficha summary::after{content:'+';font-family:var(--sans);font-size:22px;color:var(--suave);transition:transform .25s var(--ease)}
  .ficha details[open] summary::after{transform:rotate(45deg)}
  .ficha .cont{padding:0 2px 16px;font-size:14.5px;line-height:1.65;color:#463a35}
  .ficha .cont p{margin:0 0 10px;white-space:pre-line}
  .ficha ul{margin:0;padding:0;list-style:none}
  .ficha li{position:relative;padding:0 0 8px 20px}
  .ficha li::before{content:'';position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--terracota)}
  .ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
  .ficha dt{color:var(--suave)}.ficha dd{margin:0}
  .etiquetas{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .etiquetas span{font-size:12px;padding:4px 11px;border-radius:999px;background:var(--arena)}
  .cargando-ficha div{height:12px;border-radius:6px;margin:12px 0;background:linear-gradient(90deg,var(--arena),#EFE9DF,var(--arena));background-size:200% 100%;animation:brillo 1.2s infinite}
  .rel{margin-top:26px}
  .rel h3{margin:0 0 12px;font-family:var(--sans);font-weight:400;font-size:19px}
  .rel-fila{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none}
  .rel-fila::-webkit-scrollbar{display:none}
  .rel-fila button{flex:0 0 132px;text-align:left;scroll-snap-align:start}
  .rel-fila .ph{border-radius:12px}
  .rel-fila span{display:block;font-size:12.5px;line-height:1.3;margin-top:6px}
  .rel-fila small{color:var(--suave)}

  /* Lightbox */
  .lb{position:fixed;inset:0;z-index:60;background:rgba(20,14,12,.96);display:none;flex-direction:column}
  .lb.on{display:flex}
  .lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
  .lb-pista{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y pinch-zoom}
  .lb-pista::-webkit-scrollbar{display:none}
  .lb-s{flex:0 0 100%;scroll-snap-align:center;overflow:auto;display:flex;align-items:center;justify-content:center}
  .lb-s img{max-width:100%;max-height:100%;object-fit:contain;transition:width .25s}
  .lb-s.z{align-items:flex-start;justify-content:flex-start}
  .lb-s.z img{max-width:none;max-height:none;width:230%}
  .lb-info{padding:10px 16px calc(14px + env(safe-area-inset-bottom));text-align:center;color:#d8cfc5;font-size:12.5px}

  /* Bolsa */
  .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--arena)}
  .it img{flex:0 0 62px;width:62px;height:78px;border-radius:10px;object-fit:cover;background:var(--arena)}
  .it .t{flex:1;min-width:0;font-size:14px;line-height:1.3}
  .it .t small{display:block;color:var(--suave);font-size:12.5px;margin-top:2px}
  .it .paso button{width:38px;height:38px}
  .it .paso b{min-width:26px;font-size:15px}
  .cuentas{margin:16px 0 4px;font-size:14.5px}
  .cuentas div{display:flex;justify-content:space-between;padding:4px 0}
  .cuentas .g{color:var(--salvia-txt);font-weight:600}
  .cuentas .tot{border-top:1px solid var(--piedra);margin-top:8px;padding-top:10px}
  .cuentas .tot b{font-family:var(--sans);font-size:24px;font-weight:400}
  .pista{font-size:13px;color:var(--salvia-txt);margin:8px 0 0;line-height:1.4}

    try{ on = localStorage.getItem('kaem_cat_sonido') !== '0'; }catch(e){}   // con el almacenamiento bloqueado, el catálogo igual abre
    function notas(lista, vol){
      if(!on) return;
      try{
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if(ctx.state === 'suspended') ctx.resume();
        var t0 = ctx.currentTime;
        lista.forEach(function(n){
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = n[0];
          g.gain.setValueAtTime(0.0001, t0 + n[1]);
          g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + n[1] + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
          o.connect(g); g.connect(ctx.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2] + 0.02);
        });
      }catch(e){}
    }
    function libre(ms){ var t = Date.now(); if(t - ult < ms) return false; ult = t; return true; }   // evita ráfagas de sonido al deslizar
    return {
      agregar: function(){ notas([[880,0,.07],[1320,.05,.09]]); },
      quitar:  function(){ notas([[560,0,.09]], .05); },
      tono:    function(){ notas([[1180,0,.05]], .04); },
      tic:     function(){ if(libre(70)) notas([[1500,0,.02]], .025); },
      abrir:   function(){ if(libre(160)) notas([[620,0,.05],[830,.04,.07]], .035); },
      cerrar:  function(){ if(libre(160)) notas([[760,0,.05],[540,.04,.07]], .03); },
      fav:     function(){ notas([[784,0,.06],[1175,.05,.12]], .05); },
      hito:    function(){ notas([[660,0,.1],[880,.09,.1],[1175,.18,.18]]); },
      enviado: function(){ notas([[523,0,.12],[659,.1,.12],[784,.2,.12],[1047,.3,.3]]); },
      error:   function(){ notas([[240,0,.16]], .06); },
      on: function(){ return on; },
      alternar: function(){ on = !on; try{ localStorage.setItem('kaem_cat_sonido', on?'1':'0'); }catch(e){} if(on) notas([[988,0,.08]]); return on; }
    };
  })();

    function est(){ var max = c.scrollWidth - c.clientWidth; w.classList.toggle('mas-i', c.scrollLeft > 2); w.classList.toggle('mas-d', c.scrollLeft < max - 2); }
    if(!w._lista){
      w._lista = true;
      c.addEventListener('scroll', est, { passive:true }); window.addEventListener('resize', est);
      i.addEventListener('click', function(){ c.scrollBy({ left: -Math.max(160, c.clientWidth*0.7), behavior:'smooth' }); SON.tic(); });

      c.addEventListener('pointerdown', function(e){ if(e.pointerType !== 'mouse') return; arr = true; movio = false; x0 = e.clientX; s0 = c.scrollLeft; });
      window.addEventListener('pointermove', function(e){ if(!arr) return; var dx = e.clientX - x0; if(Math.abs(dx) > 4) movio = true; c.scrollLeft = s0 - dx; });

  /* ——— Servidor (Apps Script): reintentos con espera; el pedido lleva llave para que NUNCA se duplique ——— */
  function api(action, data, idem){
    var intento = 0, enCurso = 0;
    function una(){
      intento++;
      var ctrl = window.AbortController ? new AbortController() : null, t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 45000);
      return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, redirect:'follow', cache:'no-store',
        signal: ctrl ? ctrl.signal : undefined, body: JSON.stringify({ action:action, data:data, idem:idem||undefined }) })
        .then(function(r){ return r.text(); })
        .then(function(txt){ clearTimeout(t); var j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('respuesta'); } return j; })
        .then(function(j){ if(j && j.enCurso && enCurso<8){ enCurso++; intento--; return pausa(2500).then(una); } return j; })
        .catch(function(e){
          clearTimeout(t);
          var puede = intento < 3 && navigator.onLine !== false && (action !== 'enviarPedidoCatalogo' || !!idem);
          if(puede) return pausa(900*intento + Math.floor(Math.random()*400)).then(una);
          throw e;
        });
    }
    return una();
  }

  /* ——— Hojas: abrir/cerrar con teclado (Esc), botón Atrás del celular y bloqueo del fondo ——— */

  }
  function cerrar(id, desdeAtras){

    var rec=HOJAS.splice(i,1)[0];

    api('catalogoPublico', { clave:CLAVE }).then(function(r){
      if(!r || !r.ok){
        if(r && (r.apagado || /no es válido|venció/i.test(r.message||''))){
          try{ localStorage.removeItem(K_CAT); localStorage.removeItem(K_CAR); }catch(e){}

      if(!previo){ $('grid').innerHTML=''; $('estado').style.display='block'; $('estado').innerHTML='<b>No pudimos conectar 📶</b>Revisa tu internet y <a href="" style="color:inherit">vuelve a intentar</a>. Si la tienda estaba dormida, puede tardar hasta un minuto.'; }

  function filtrados(){
    var q=sinTildes(FILTRO.q).trim().split(/\s+/).filter(Boolean);
    var lista = CAT.productos.filter(function(g){
      if(FILTRO.fav && !FAV[g.id]) return false;
      if(FILTRO.marca && g.marca!==FILTRO.marca) return false;
      if(FILTRO.tipo && g.tipo!==FILTRO.tipo) return false;
      if(q.length){ var tx=sinTildes(g.nombre+' '+g.marca+' '+(g.tipo||'')+' '+g.variantes.map(function(v){ return v.tono; }).join(' ')); return q.every(function(w){ return tx.indexOf(w)>=0; }); }
      return true;
    });
    var pm=function(g){ return Math.min.apply(null, g.variantes.map(function(v){ return v.precio; })); };
    if(FILTRO.orden==='menor') lista=lista.slice().sort(function(a,b){ return pm(a)-pm(b); });
    else if(FILTRO.orden==='mayor') lista=lista.slice().sort(function(a,b){ return pm(b)-pm(a); });

      +campo('cCiudad','Ciudad',c.ciudad,'text','class="mayus" list="ciudades" autocomplete="address-level2" maxlength="60" placeholder="Ej. Bucaramanga"')
      +'<datalist id="ciudades">'+(CAT.envio.ciudadesAM||[]).concat(['Bogotá','Medellín','Cali','Barranquilla','Cartagena','Cúcuta','Pereira','Manizales','Ibagué','Santa Marta','Villavicencio','Pasto','Neiva','Armenia','Montería','Sincelejo','Popayán','Valledupar','Tunja','Soacha','Bello','Itagüí','Envigado','Sabaneta','Soledad','Palmira','Buenaventura','Tuluá','Dosquebradas','Riohacha','Florencia','Yopal','Quibdó','San Gil','Barrancabermeja','Socorro','Málaga','Pamplona','Ocaña','Girardot','Chía','Zipaquirá','Facatativá','Rionegro','Apartadó','Turbo','Maicao','Duitama','Sogamoso','Cartago','Ipiales','Tumaco','Leticia','San Andrés']).map(function(x){ return '<option value="'+esc(x)+'">'; }).join('')+'</datalist>'
      +campo('cDir','Dirección de entrega',c.direccion,'text','class="mayus" autocomplete="street-address" maxlength="140" placeholder="Calle, número, barrio, apto o casa"')
      +'<div class="campo"><label for="cNotas">Notas (opcional)</label><textarea id="cNotas" rows="2" maxlength="300" placeholder="Horario, indicaciones, ¿es un regalo?…"></textarea></div>'
      +'<input class="trampa" id="cWeb" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">'
      +'<p class="nota-pie">Al enviar, tu pedido llega a KAÉM 🤎 y se abre WhatsApp para confirmarlo más rápido. El pago se coordina por allí.</p>';
    $('hbCuerpo').innerHTML=h; $('hbPie').innerHTML='<button class="btn" id="enviar" type="button">Enviar pedido ✨</button>';
    Object.keys(previo).forEach(function(id){ if(previo[id]!=='' && $(id)) $(id).value=previo[id]; });
    pintarCuentas();
  }
  function pintarCuentas(){
    var box=$('cuentas'); if(!box) return;
    var ciu=($('cCiudad')||{}).value||'', t=totales(ciu), envio;
    if(!t.ciudad) envio='<span style="color:var(--suave)">Elige tu ciudad</span>';
    else envio = t.flete===0 ? '<span class="g">¡Gratis! 🚚</span>' : cop(t.flete);
    box.innerHTML='<div><span>Subtotal · '+t.unidades+(t.unidades===1?' unidad':' unidades')+'</span><span>'+cop(t.subtotal)+'</span></div><div><span>Envío</span>'+envio+'</div>'
      +'<div class="tot"><span>Total</span><b>'+cop(t.total)+'</b></div>';
    var p=$('pistaEnvio'); if(!p) return;
    var e=CAT.envio;
    if(!t.ciudad) p.textContent='🚚 Envío gratis en Bucaramanga y área metropolitana desde '+cop(e.localGratisDesde)+' · al resto del país desde '+cop(e.gratisDesde)+'.';
    else if(t.flete) p.textContent='💡 Agrega '+cop(t.falta)+' más y el envío te sale gratis'+(t.local?'':' (a tu ciudad es desde '+cop(e.gratisDesde)+')')+'. Hoy el flete es de '+cop(e.tarifa)+'.';
    else p.textContent='🎉 ¡Tu pedido tiene envío gratis!';
  }
  function enviar(){
    var val=function(id){ return String((($(id))||{}).value||'').trim(); };
    var may=function(id){ return val(id).toUpperCase(); };
    var cli={ nombre:may('cNombre'), nit:may('cNit'), telefono:val('cTel'), ciudad:may('cCiudad'), direccion:may('cDir') };
    var mal=function(id, msg){ SON.error(); aviso(msg); var el=$(id); el.classList.remove('mal'); void el.offsetWidth; el.classList.add('mal'); el.focus(); vibrar(40); };
    if(cli.nombre.length<3) return mal('cNombre','👤 Escribe tu nombre.');
    if(!/^3\d{9}$/.test(cli.telefono)) return mal('cTel','📱 Escribe tu celular de 10 dígitos (empieza por 3).');
    if(!cli.ciudad) return mal('cCiudad','📍 Escribe tu ciudad.');
    if(cli.direccion.length<5) return mal('cDir','🏠 Escribe tu dirección de entrega.');
    guardar('kaem_cliente', cli); CIUDAD_CLI=cli.ciudad;
    var b=$('enviar'); b.disabled=true; b.textContent='Enviando… ⏳';
    var items=Object.keys(CARRITO).map(function(s){ return { sku:s, cantidad:CARRITO[s] }; });
    if(!IDEM_PEDIDO) IDEM_PEDIDO='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    api('enviarPedidoCatalogo', { clave:CLAVE, cliente:cli, items:items, notas:val('cNotas'), web:val('cWeb') }, IDEM_PEDIDO).then(function(r){
      if(!r || !r.ok){
        b.disabled=false; b.textContent='Enviar pedido ✨'; vibrar(40); SON.error(); aviso((r&&r.message)||'No se pudo enviar el pedido.');
        var mapa={ nombre:'cNombre', nit:'cNit', telefono:'cTel', ciudad:'cCiudad', direccion:'cDir' };
        if(r && r.campo && mapa[r.campo]){ var el=$(mapa[r.campo]); if(el){ el.classList.remove('mal'); void el.offsetWidth; el.classList.add('mal'); el.focus(); } }
        return;
      }
      var nom=function(i){ return i.nombre+(i.tono && i.nombre.toUpperCase().indexOf(i.tono.toUpperCase())<0 ? ' · '+i.tono : ''); };
      var txt='✨ *¡Hola, KAÉM!* Quiero hacer este pedido 🛍\n\n🧾 *Pedido '+r.id+'* · Tienda Detal\n\n*Productos*\n'
        + r.items.map(function(i){ return '• '+i.cantidad+' × '+nom(i)+' — '+cop(i.subtotal); }).join('\n')
        + '\n\n💰 Subtotal: '+cop(r.subtotal)+'\n🚚 Envío: '+(r.flete?cop(r.flete):'¡Gratis! 🎉')+'\n💳 *Total: '+cop(r.total)+'* · '+r.unidades+(r.unidades===1?' unidad':' unidades')
        + '\n\n📦 *Datos de entrega*\n👤 '+cli.nombre+'\n📱 '+cli.telefono+'\n📍 '+cli.ciudad+'\n🏠 '+cli.direccion + (val('cNotas')?'\n📝 '+val('cNotas'):'')
        + '\n\nQuedo atenta(o) a la confirmación y los datos de pago. ¡Gracias! 🤎';
      txt=txt.replace(/️/g,'');
      var wa='https://api.whatsapp.com/send?phone='+CAT.whatsapp+'&text='+encodeURIComponent(txt);
      IDEM_PEDIDO=''; CARRITO={}; guardar(K_CAR, CARRITO); pintar(false); pintarContadores(); pintarBarra(true); vibrar([15,50,15]); SON.enviado();
      var primer=cli.nombre.split(' ')[0]; primer=primer.charAt(0).toUpperCase()+primer.slice(1).toLowerCase();
      $('hbTitulo').textContent='¡Pedido enviado!';
      $('hbCuerpo').innerHTML='<div class="exito"><svg class="ok" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"/><path d="M19 33l9 9 17-19"/></svg><h3>¡Listo, '+esc(primer)+'!</h3>'
        +'<p>Tu pedido <b>'+esc(r.id)+'</b> llegó a KAÉM 🤎<br>Total '+cop(r.total)+' · '+r.unidades+(r.unidades===1?' unidad':' unidades')+(r.flete?'':' · envío gratis 🚚')+'</p>'
        +'<p>Envíalo también por WhatsApp para confirmarlo más rápido 👇</p></div>';
      $('hbPie').innerHTML='<a class="btn wa" id="waBtn" href="'+esc(wa)+'" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Confirmar por WhatsApp</a>'
        +'<button class="btn claro" type="button" data-cerrar style="margin-top:10px">Seguir viendo la tienda</button>';
    }).catch(function(){ b.disabled=false; b.textContent='Enviar pedido ✨'; SON.error(); aviso('No pudimos conectar 📶 Revisa tu internet e intenta de nuevo; tu bolsa sigue guardada.'); });
  }

  /* ——— Filtros (hoja) ——— */
  function pintarFiltros(){
    var tipos=tiposDe(), opc=function(campo, valor, txt){ return '<button type="button" class="chip'+(FILTRO[campo]===valor?' on':'')+'" data-f="'+campo+'" data-v="'+esc(valor)+'">'+esc(txt)+'</button>'; };
    var h='';
    if(tipos.length) h+='<div class="f-grupo"><h3>Categoría</h3><div class="f-opc">'+opc('tipo','','Todas')+tipos.map(function(t){ return opc('tipo',t,t); }).join('')+'</div></div>';
    h+='<div class="f-grupo"><h3>Marca</h3><div class="f-opc">'+opc('marca','','Todas')+CAT.marcas.map(function(m){ return opc('marca',m,m); }).join('')+'</div></div>'
      +'<div class="f-grupo"><h3>Ordenar por</h3><div class="f-opc">'+opc('orden','','Destacados')+opc('orden','menor','Precio: menor a mayor')+opc('orden','mayor','Precio: mayor a menor')+opc('orden','az','Nombre A–Z')+'</div></div>';
    $('hfCuerpo').innerHTML=h;
  }

  /* ——— Eventos ——— */
  var tq=0; $('q').addEventListener('input', function(){ var v=this.value; clearTimeout(tq); tq=setTimeout(function(){ FILTRO.q=v; MOSTRADOS=PAGINA; pintar(false); }, 160); });
  $('chips').addEventListener('click', function(e){
    var b=e.target.closest('[data-c]'); if(!b) return; var campo=$('chips').getAttribute('data-campo'), v=b.getAttribute('data-c');
    FILTRO.fav=false; FILTRO[campo]=v; MOSTRADOS=PAGINA; vibrar(5); SON.tono(); pintarChips(); pintar(true);
  });
  $('bFiltro').addEventListener('click', function(){ pintarFiltros(); abrir('hFiltros'); });
  $('hfCuerpo').addEventListener('click', function(e){ var b=e.target.closest('[data-f]'); if(!b) return; FILTRO[b.getAttribute('data-f')]=b.getAttribute('data-v'); MOSTRADOS=PAGINA; pintarFiltros(); pintarChips(); pintar(false); });
  $('hfListo').addEventListener('click', function(){ cerrar('hFiltros'); });
  $('hfLimpiar').addEventListener('click', function(){ FILTRO.marca=FILTRO.tipo=FILTRO.orden=''; pintarFiltros(); pintarChips(); pintar(false); });
  $('limpiar').addEventListener('click', function(){ FILTRO={ q:'', marca:'', tipo:'', orden:'', fav:false }; $('q').value=''; MOSTRADOS=PAGINA; pintarChips(); pintar(true); });
  $('bFav').addEventListener('click', function(){ FILTRO.fav=!FILTRO.fav; MOSTRADOS=PAGINA; pintarChips(); pintar(true); window.scrollTo({ top:0 }); if(FILTRO.fav) aviso('♡ Mostrando tus favoritos', 1500); });
  $('bBolsa').addEventListener('click', function(){ pintarBolsa(); abrir('hBolsa'); });
  $('sonido').addEventListener('click', function(){ SON.alternar(); pintarSonido(); vibrar(8); });
  pintarSonido();
  $('verMas').addEventListener('click', function(){ MOSTRADOS+=PAGINA; pintar(false); });
  window.addEventListener('scroll', function(){ $('barraTop').classList.toggle('sombra', window.scrollY>90); }, { passive:true });
  // "Ver más" automático al llegar al final de la lista
  if('IntersectionObserver' in window){ new IntersectionObserver(function(es){ if(es[0].isIntersecting && !$('mas').hidden) { MOSTRADOS+=PAGINA; pintar(false); } }, { rootMargin:'600px' }).observe($('mas')); }

  document.addEventListener('click', function(e){
    var t=e.target; if(!t.closest) return;
    if(t.closest('[data-cerrar]')){ cerrarArriba(); return; }
    var ver=t.closest('[data-ver]'); if(ver){ abrirProducto(parseInt(ver.getAttribute('data-ver'),10)); return; }
    var add=t.closest('[data-add]'); if(add){ agregarRapido(parseInt(add.getAttribute('data-add'),10)); return; }
    var fav=t.closest('[data-fav]'); if(fav){ alternarFav(parseInt(fav.getAttribute('data-fav'),10)); return; }
    var rel=t.closest('[data-rel]'); if(rel){ abrirProducto(parseInt(rel.getAttribute('data-rel'),10)); $('hpCuerpo').scrollTop=0; return; }
    var tono=t.closest('[data-tono]'); if(tono){ cambiarTono(tono.getAttribute('data-tono')); return; }
    var q=t.closest('[data-q]'); if(q){ PROD.cant=Math.max(1, Math.min(MAX_LINEA, PROD.cant+parseInt(q.getAttribute('data-q'),10))); $('hpQ').textContent=PROD.cant; pintarPieProducto(); vibrar(5); SON.tic(); return; }
    if(t.closest('#hpAgregar')){ agregarDesdeProducto(); return; }
    var gal=t.closest('[data-gal]'); if(gal){ irFoto(Math.max(0, Math.min((galeriaDe(CAT.productos[PROD.i], PROD.sku).length)-1, PROD.foto+parseInt(gal.getAttribute('data-gal'),10)))); return; }
    var mini=t.closest('[data-mini]'); if(mini){ irFoto(parseInt(mini.getAttribute('data-mini'),10)); return; }
    var fig=t.closest('#galPista figure img'); if(fig){ abrirLB(PROD.foto); return; }
    if(t.closest('[data-reficha]')){ var g=CAT.productos[PROD.i]; if(g){ var f=$('ficha'); if(f) f.innerHTML='<div class="cargando-ficha"><div></div><div style="width:70%"></div></div>'; cargarFicha(g); } return; }
    var mas=t.closest('[data-mas]'); if(mas){ var s=mas.getAttribute('data-mas'); cambiarLinea(s,(CARRITO[s]||0)+1); vibrar(6); SON.agregar(); pintarBolsa(); pintar(false); pintarContadores(); pintarBarra(false); return; }
    var menos=t.closest('[data-menos]'); if(menos){ var s2=menos.getAttribute('data-menos'); cambiarLinea(s2,(CARRITO[s2]||0)-1); vibrar(4); SON.quitar(); pintarBolsa(); pintar(false); pintarContadores(); pintarBarra(false); return; }
    if(t.closest('#verBolsa')){ pintarBolsa(); abrir('hBolsa'); return; }
    if(t.closest('#enviar')){ enviar(); return; }
  });
  $('hProd').addEventListener('hidden', function(){});
  $('hbCuerpo').addEventListener('input', function(e){
    if(e.target.classList) e.target.classList.remove('mal');
    if(e.target.id==='cTel'){ var d=e.target.value.replace(/\D/g,''); if(d.length>10 && d.indexOf('57')===0) d=d.slice(2); d=d.slice(0,10); if(e.target.value!==d) e.target.value=d; }
    if(e.target.id==='cCiudad') pintarCuentas();
  });
  // Al cerrar el producto se limpia el enlace profundo
  var cerrarOrig=cerrar; cerrar=function(id, a){ cerrarOrig(id, a); if(id==='hProd'){ try{ history.replaceState(history.state, '', location.pathname+location.search); }catch(e){} } };
  var abrirOrig=abrir; abrir=function(id){ SON.abrir(); vibrar(6); return abrirOrig(id); };
  var cerrarSon=cerrar; cerrar=function(id, a){ SON.cerrar(); return cerrarSon(id, a); };
  cargar();
})();
</script>
</body>
</html>
