<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>KAÉM · Generador de imagen para compartir</title>
<link rel="stylesheet" href="catalogo-base.css">
<style>
  body{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px;min-height:100vh}
  h1{font:400 28px var(--serif);margin:0;text-align:center}
  p{max-width:560px;text-align:center;color:var(--suave);margin:0;line-height:1.5}
  canvas{width:min(100%,720px);height:auto;border-radius:16px;box-shadow:0 10px 40px rgba(44,33,30,.15);background:#F7F4EE}
  button{padding:14px 26px;border-radius:16px;background:var(--espresso);color:#fff;font-weight:600;font-size:16px}
</style></head><body>
<h1>Imagen para compartir los catálogos</h1>
<p>Usa tu <b>logo.png</b> y la tipografía de la marca. Toca el botón, se descarga <b>og-catalogos.jpg</b> (1200 × 630) y la subes a GitHub junto a los demás archivos.</p>
<canvas id="c" width="1200" height="630"></canvas>
<button id="d" type="button">Descargar og-catalogos.jpg</button>
<script>
(function(){
  var c=document.getElementById('c'), x=c.getContext('2d'), logo=new Image();
  function letras(t, cx, y, sp){ var w=0, a=[]; for(var i=0;i<t.length;i++){ var m=x.measureText(t[i]).width; a.push(m); w+=m+(i<t.length-1?sp:0); } var px=cx-w/2; for(var j=0;j<t.length;j++){ x.fillText(t[j], px, y); px+=a[j]+sp; } }
  function dibujar(){
    var g=x.createRadialGradient(600,260,40,600,315,640); g.addColorStop(0,'#FBF8F3'); g.addColorStop(1,'#EFE7DB'); x.fillStyle=g; x.fillRect(0,0,1200,630);
    x.strokeStyle='rgba(44,33,30,.14)'; x.lineWidth=2; x.strokeRect(28,28,1144,574);
    var w=560, h=w*logo.naturalHeight/logo.naturalWidth; x.drawImage(logo,600-w/2,120,w,h);
    var y=120+h+66;
    x.strokeStyle='rgba(44,33,30,.35)'; x.lineWidth=1.5; x.beginPath(); x.moveTo(380,y-14); x.lineTo(500,y-14); x.moveTo(700,y-14); x.lineTo(820,y-14); x.stroke();
    x.fillStyle='#2C211E'; x.font='400 40px "TAN Pearl", Georgia, serif'; x.textBaseline='alphabetic'; letras('CATÁLOGO',600,y,14);
  }
  logo.onload=function(){ (document.fonts&&document.fonts.load?document.fonts.load('40px "TAN Pearl"'):Promise.resolve()).then(dibujar,dibujar); };
  logo.onerror=function(){ x.fillStyle='#F7F4EE'; x.fillRect(0,0,1200,630); x.fillStyle='#2C211E'; x.font='28px sans-serif'; x.fillText('No se encontró logo.png en esta carpeta',320,320); };
  logo.src='logo.png';
  document.getElementById('d').addEventListener('click', function(){ var a=document.createElement('a'); a.download='og-catalogos.jpg'; a.href=c.toDataURL('image/jpeg',0.92); a.click(); });
})();
</script></body></html>
